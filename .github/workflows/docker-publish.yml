name: Publish test target image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the test target image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/pentest
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/team13-test-target:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/team13-test-target:latest